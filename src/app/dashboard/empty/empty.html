<div class="dash-grid">
  <aside class="info-panel">
    <app-dash-welcome />
    <app-messages-list />
    <app-conversion-area />
  </aside>

  <div class="dash-main">
    <section class="dash-card empty-card">
      <img class="empty-art" src="assets/dash-empty.png" alt="No data illustration" />
      <h2>There is no data to display.<br />Setup your business.</h2>
      <p>Enter your details to proceed further</p>
      <button class="btn btn-primary setup-btn" type="button" (click)="onSetup()">Setup</button>
    </section>
  </div>
</div>
