<div class="dash-grid" app-dash-page>
  <aside page-info class="info-panel">
    <app-dash-welcome />
    <app-messages-list />
    <app-conversion-area />
  </aside>

  <div page-main class="dash-main">
    <section class="dash-card empty-card">
      <app-empty-state
        image="assets/dash-empty.png"
        imageAlt="No data illustration"
        title="There is no data to display."
        subtitle="Setup your business."
        text="Enter your details to proceed further"
        actionLabel="Setup"
        (action)="onSetup()"
      />
    </section>
  </div>
</div>
