<div class="dash">
  <aside class="rail" aria-label="Primary">
    <a class="rail-logo" routerLink="/dashboard" aria-label="CRM home">C</a>
    <nav class="rail-nav">
      <!-- Section home: stays highlighted for every view inside the Dashboard section -->
      <a routerLink="/dashboard" replaceUrl routerLinkActive="active" title="Dashboard" aria-label="Dashboard">
        <svg viewBox="0 0 24 24"><path d="M4.5 19a7.5 7.5 0 1 1 15 0"/><path d="M12 15.5 15.5 10"/><circle cx="12" cy="15.5" r="1.2" /></svg>
      </a>
      <!-- Projects section -->
      <a routerLink="/projects" replaceUrl title="Projects" aria-label="Projects">
        <svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="2"/><path d="M9 8V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V8M4 12.5h16"/></svg>
      </a>
      <!-- Orders and invoices to fulfill -->
      <button type="button" title="Orders" aria-label="Orders">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="15" rx="2"/><rect x="9.5" y="3" width="5" height="3.5" rx="1"/><path d="m10.5 13 2 2 3.5-4"/></svg>
      </button>
      <button type="button" title="Files" aria-label="Files">
        <svg viewBox="0 0 24 24"><path d="M5 15V6a2 2 0 0 1 2-2h9"/><rect x="7" y="7" width="12" height="12" rx="2"/></svg>
      </button>
      <button type="button" title="Calendar" aria-label="Calendar">
        <svg viewBox="0 0 24 24"><rect x="4.5" y="6" width="15" height="13" rx="2"/><path d="M4.5 10h15M8.5 3.5V7M15.5 3.5V7M8.5 13.8h.01M12 13.8h.01M15.5 13.8h.01M8.5 16.8h.01M12 16.8h.01"/></svg>
      </button>
      <button type="button" title="Team" aria-label="Team">
        <svg viewBox="0 0 24 24"><circle cx="10" cy="8.5" r="3"/><path d="M4 19.5c1.2-3 3.4-4.5 6-4.5 1 0 2 .2 2.9.6"/><rect x="14.5" y="13.5" width="6" height="5.5" rx="1.2"/><path d="M16 13.5v-1.3a1.8 1.8 0 0 1 3.6 0v1.3"/></svg>
      </button>
      <!-- Customer messages live in this view's side panel -->
      <button type="button" title="Messages" aria-label="Messages">
        <svg viewBox="0 0 24 24"><path d="M4.5 7A1.5 1.5 0 0 1 6 5.5h9A1.5 1.5 0 0 1 16.5 7v5a1.5 1.5 0 0 1-1.5 1.5H12l-3.5 3v-3H6A1.5 1.5 0 0 1 4.5 12V7Z"/><path d="M16.5 5.5H18A1.5 1.5 0 0 1 19.5 7v6a1.5 1.5 0 0 1-1.5 1.5h-1"/></svg>
        <i class="dot green"></i>
      </button>
      <button type="button" title="Products" aria-label="Products">
        <svg viewBox="0 0 24 24"><path d="M4 8.5 12 4l8 4.5v8L12 21l-8-4.5v-8Z"/><path d="M4 8.5 12 13l8-4.5M12 13v8"/></svg>
      </button>
      <button type="button" title="Reports" aria-label="Reports">
        <svg viewBox="0 0 24 24"><rect x="6.5" y="3.5" width="11" height="17" rx="2"/><path d="M9.5 7.5h5M9.5 11.5h.01M12 11.5h.01M14.5 11.5h.01M9.5 14.5h.01M12 14.5h.01M14.5 14.5h.01M9.5 17.5h.01M12 17.5h.01M14.5 17.5h.01"/></svg>
      </button>
      <button type="button" title="Map" aria-label="Map">
        <svg viewBox="0 0 24 24"><path d="M9 4 4.5 5.8v13L9 17l6 1.8 4.5-1.8v-13L15 5.8 9 4Z"/><path d="M9 4v13M15 5.8v13"/></svg>
      </button>
      <button type="button" title="Goals" aria-label="Goals">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" /></svg>
        <i class="dot red"></i>
      </button>
      <button type="button" title="Activity" aria-label="Activity">
        <svg viewBox="0 0 24 24"><path d="M3.5 9.5c2-2.5 4-2.5 6 0s4 2.5 6 0c1.2-1.5 2.4-2 5-1"/><path d="M3.5 14.5c2-2.5 4-2.5 6 0s4 2.5 6 0c1.2-1.5 2.4-2 5-1"/></svg>
      </button>
      <button type="button" title="Help" aria-label="Help">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.6A2.3 2.3 0 0 1 12 8.2c1.3 0 2.3.9 2.3 2 0 1.4-1.4 1.7-2.3 2.4v.7M12 16.8h.01"/></svg>
      </button>
    </nav>
    <div class="rail-avatar" title="Craft UI">C</div>
  </aside>

  <div class="dash-body">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" type="button" aria-label="Back" title="Back" (click)="goBack()">
          <svg viewBox="0 0 24 24"><path d="M15 5.5 8.5 12l6.5 6.5"/></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1>Dashboard</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" type="button" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m15.5 15.5 4 4"/></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Account">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.2"/><path d="M5.5 19.5c1.4-3 3.7-4.5 6.5-4.5s5.1 1.5 6.5 4.5"/></svg>
        </button>
      </div>
    </header>
    <div class="dash-content">
      <router-outlet />
    </div>
  </div>
</div>
