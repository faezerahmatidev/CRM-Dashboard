<div class="dash">
  <aside class="rail" aria-label="Primary">
    <a class="rail-logo" routerLink="/dashboard" aria-label="CRM home">C</a>
    <nav class="rail-nav">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" title="Dashboard" aria-label="Dashboard">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      </a>
      <a routerLink="/dashboard/overview" routerLinkActive="active" title="Overview" aria-label="Overview">
        <svg viewBox="0 0 24 24"><path d="M4 4v15a1 1 0 0 0 1 1h15"/><path d="M7 14.5 10.5 11l3 3 4.5-5.5"/></svg>
      </a>
      <a routerLink="/dashboard/orders" routerLinkActive="active" title="Orders" aria-label="Orders">
        <svg viewBox="0 0 24 24"><path d="M4 8.5 12 4l8 4.5v8L12 21l-8-4.5v-8Z"/><path d="M4 8.5 12 13l8-4.5M12 13v8"/></svg>
      </a>
      <button type="button" title="Calendar" aria-label="Calendar">
        <svg viewBox="0 0 24 24"><rect x="4.5" y="6" width="15" height="13" rx="2"/><path d="M4.5 10h15M8.5 3.5V7M15.5 3.5V7"/></svg>
      </button>
      <a routerLink="/dashboard/messages" routerLinkActive="active" title="Messages" aria-label="Messages">
        <svg viewBox="0 0 24 24"><path d="M4.5 6.5A1.5 1.5 0 0 1 6 5h12a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H12l-4.5 4v-4H6A1.5 1.5 0 0 1 4.5 14.5v-8Z"/></svg>
      </a>
      <button type="button" title="Customers" aria-label="Customers">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="2.8"/><path d="M3.5 18.5c1-2.7 3-4 5.5-4s4.5 1.3 5.5 4M15.5 6.2a2.8 2.8 0 0 1 0 4.9M17.5 14.9c1.4.7 2.4 1.9 3 3.6"/></svg>
      </button>
      <button type="button" title="Tasks" aria-label="Tasks">
        <svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </button>
      <button type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.15-1.4l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.4-1.4L13.8 2h-3.6l-.35 2.6a7 7 0 0 0-2.4 1.4l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.8l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.4 1.4l.35 2.6h3.6l.35-2.6a7 7 0 0 0 2.4-1.4l2.3 1 2-3.4-2-1.5c.1-.45.15-.92.15-1.4Z"/></svg>
      </button>
    </nav>
    <div class="rail-avatar" title="Craft UI">C</div>
  </aside>

  <div class="dash-body">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1>Dashboard</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" type="button" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m15.5 15.5 4 4"/></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Account">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.2"/><path d="M5.5 19.5c1.4-3 3.7-4.5 6.5-4.5s5.1 1.5 6.5 4.5"/></svg>
        </button>
      </div>
    </header>
    <div class="dash-content">
      <router-outlet />
    </div>
  </div>
</div>
