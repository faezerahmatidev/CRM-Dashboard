<div class="dash-grid" app-dash-page>
  <aside page-info class="info-panel">
    <app-dash-welcome />
    <app-latest-updates />
    <app-upcoming-events />
  </aside>

  <div page-main class="dash-main">
    <div class="cards-2">
      <app-chart-card
        title="Your Sales"
        [tabs]="tabs"
        [(tab)]="salesTab"
        [calendar]="true"
        bigNumber="$142,000"
        bigSub="Total income"
        [sets]="salesSets"
        [xLabels]="['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul']"
        viewBox="0 0 560 230"
        [labelY]="214"
        [labelStartX]="30"
        [labelStepX]="83"
      />

      <app-events-card [events]="events" linkAll="/dashboard/orders" />
    </div>

    <div class="cards-2">
      <section class="dash-card" app-dash-card title="Income Breakdown" [tabs]="tabs" [(tab)]="donutTab" [calendar]="true">
        <div class="donut-wrap">
          <svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Income breakdown donut chart">
            <g transform="rotate(-90 100 100)" fill="none" stroke-width="26">
              @for (s of donutSegs(donutSets[donutTab].values); track $index) {
                <circle cx="100" cy="100" r="70" [attr.stroke]="donutColors[$index]"
                  [attr.stroke-dasharray]="s.len + ' 439.823'" [attr.stroke-dashoffset]="s.off" />
              }
            </g>
            <text x="100" y="106" text-anchor="middle" font-size="22" font-weight="900" fill="#1c1d21">{{ donutSets[donutTab].total }}</text>
            <text x="148" y="72" font-size="10" font-weight="bold" fill="#5e81f4">{{ donutSets[donutTab].pct }}</text>
          </svg>
          <ul class="legend">
            @for (n of donutNames; track n) {
              <li><i [style.background]="legendColors[$index]"></i><span>{{ n }}</span><b>{{ donutSets[donutTab].legend[$index] }}</b></li>
            }
          </ul>
        </div>
      </section>

      <app-chart-card
        title="Income Details"
        [tabs]="tabs"
        [(tab)]="incomeTab"
        [calendar]="true"
        bigNumber="$142,000"
        [showTrend]="true"
        bigSub="Total income"
        [sets]="incomeSets"
        viewBox="0 0 560 190"
      >
        <div class="stats-3">
          <div><b>{{ incomeStats[incomeTab][0] }}</b><span>Total sales</span></div>
          <div><b>{{ incomeStats[incomeTab][1] }}</b><span>Spendings</span></div>
          <div><b>{{ incomeStats[incomeTab][2] }}</b><span>Income</span></div>
        </div>
      </app-chart-card>
    </div>
  </div>
</div>
