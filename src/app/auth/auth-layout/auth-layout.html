<div class="auth-page">
  <div class="auth-shell">
    <main class="auth-main">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="3.5" y="3.5" width="9" height="9" rx="1.5" transform="rotate(45 8 8)" />
        </svg>
        <span>{{ brand }}</span>
      </div>
      <div class="auth-content">
        <ng-content />
      </div>
    </main>
    <aside class="auth-side" aria-hidden="true">
      <img [src]="illustration" [alt]="illustrationAlt" />
    </aside>
  </div>
</div>
