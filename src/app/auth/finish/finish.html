<app-auth-layout illustration="assets/auth-finish.svg" illustrationAlt="Person standing next to an open envelope with a newsletter">
  <h1 class="auth-title">Registration complete.<br />Subscribe to our newsletters.</h1>
  <p class="auth-sub">Now you can setup your projects and teams</p>

  <form class="auth-form" (ngSubmit)="onSubmit()">
    <app-auth-field label="Email" fieldId="fn-email" icon="mail">
      <input id="fn-email" name="email" type="email" placeholder="Start typing..." autocomplete="email" />
    </app-auth-field>

    <div class="btn-row">
      <button class="btn btn-primary btn-full" type="submit">Finish</button>
    </div>
  </form>
</app-auth-layout>
