<app-auth-layout illustration="assets/auth-signup.svg" illustrationAlt="Two people shaking hands over a desk">
  <h1 class="auth-title">Welcome to our CRM.<br />Sign Up to getting started.</h1>
  <p class="auth-sub">Enter your details to proceed further</p>

  <form class="auth-form" (ngSubmit)="onSubmit()">
    <app-auth-field label="Full name" fieldId="su-name" icon="user">
      <input id="su-name" name="name" type="text" placeholder="Craft UI" autocomplete="name" />
    </app-auth-field>

    <app-auth-field label="Email" fieldId="su-email" icon="mail">
      <input id="su-email" name="email" type="email" placeholder="support@craftui.com" autocomplete="email" />
    </app-auth-field>

    <app-auth-field label="Password" fieldId="su-pass" icon="lock">
      <input id="su-pass" name="password" type="password" placeholder="Start typing..." autocomplete="new-password" />
    </app-auth-field>

    <div class="check-row">
      <span class="radio-dot" aria-hidden="true"></span>
      <span>I agree with terms &amp; conditions</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" type="submit">Sign Up</button>
      <a class="btn btn-rest" routerLink="/signin">Sign In</a>
    </div>
  </form>

  <app-auth-social />
</app-auth-layout>
