<app-auth-layout illustration="assets/auth-details.svg" illustrationAlt="Woman standing next to a large calendar">
  <h1 class="auth-title">Welcome to our CRM.<br />Sign Up to getting started.</h1>
  <p class="auth-sub">Enter your details to proceed further</p>

  <form class="auth-form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="dt-company">Company name</label>
      <div class="field-control">
        <input id="dt-company" name="company" type="text" placeholder="WhiteOnWhite" autocomplete="organization" />
        <svg class="field-icon" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="1.5"/><path d="M8 8V6.5A1.5 1.5 0 0 1 9.5 5h5A1.5 1.5 0 0 1 16 6.5V8M8 12h2m-2 3h2m2-3h2m-2 3h2M4 19h16"/></svg>
      </div>
    </div>

    <div class="field">
      <label for="dt-employees">Employees</label>
      <div class="field-control">
        <input id="dt-employees" name="employees" type="text" placeholder="1-10 Employees" />
        <svg class="field-icon" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="2.8"/><path d="M3.5 18.5c1-2.7 3-4 5.5-4s4.5 1.3 5.5 4M15.5 6.2a2.8 2.8 0 0 1 0 4.9M17.5 14.9c1.4.7 2.4 1.9 3 3.6"/></svg>
      </div>
    </div>

    <div class="field">
      <label for="dt-business">Business</label>
      <div class="field-control">
        <select id="dt-business" name="business" required>
          <option value="" disabled selected>Select business type</option>
          <option>Technology</option>
          <option>Retail</option>
          <option>Finance</option>
          <option>Healthcare</option>
        </select>
        <svg class="field-icon" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></svg>
      </div>
    </div>

    <div class="field">
      <label for="dt-phone">Phone</label>
      <div class="field-control">
        <input id="dt-phone" name="phone" type="tel" placeholder="Start typing..." autocomplete="tel" maxlength="11" inputmode="tel" />
        <svg class="field-icon" viewBox="0 0 24 24"><path d="M7 4h3l1.5 4.5-2 1.5a12 12 0 0 0 4.5 4.5l1.5-2L20 14v3a1.5 1.5 0 0 1-1.6 1.5C11 18 6 13 5.5 5.6A1.5 1.5 0 0 1 7 4Z"/></svg>
      </div>
    </div>

    <div class="btn-row details-actions">
      <a class="btn btn-rest" routerLink="/signup">Cancel</a>
      <button class="btn btn-primary" type="submit">Next</button>
    </div>
  </form>
</app-auth-layout>
