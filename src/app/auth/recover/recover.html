<app-auth-layout illustration="assets/auth-recover.svg" illustrationAlt="Person standing next to a large open envelope">
  <h1 class="auth-title">Lost your password?<br />Enter your details to recover.</h1>
  <p class="auth-sub">Enter your details to proceed further</p>

  <form class="auth-form" (ngSubmit)="onSubmit()">
    <app-auth-field label="Email" fieldId="rc-email" icon="mail">
      <input id="rc-email" name="email" type="email" placeholder="Start typing..." autocomplete="email" />
    </app-auth-field>

    <div class="btn-row">
      <button class="btn btn-primary btn-full" type="submit">Recover</button>
    </div>
  </form>

  <app-auth-social />
</app-auth-layout>
