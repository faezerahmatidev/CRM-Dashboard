<app-auth-layout illustration="assets/auth-signin.svg" illustrationAlt="Person holding up a large phone with a profile card">
  <h1 class="auth-title">Welcome to our CRM.<br />Sign In to see latest updates.</h1>
  <p class="auth-sub">Enter your details to proceed further</p>

  <form class="auth-form" (ngSubmit)="onSubmit()">
    <app-auth-field label="Email" fieldId="si-email" icon="mail">
      <input id="si-email" name="email" type="email" placeholder="john.doe@gmail.com" autocomplete="email" />
    </app-auth-field>

    <app-auth-field label="Password" fieldId="si-pass" icon="lock">
      <input id="si-pass" name="password" type="password" placeholder="Start typing..." autocomplete="current-password" />
    </app-auth-field>

    <div class="link-row">
      <div class="check-row">
        <span class="radio-dot" aria-hidden="true"></span>
        <span>Remember me</span>
      </div>
      <a class="link" routerLink="/recover">Recover password</a>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" type="submit">Sign In</button>
      <a class="btn btn-rest" routerLink="/signup">Sign Up</a>
    </div>
  </form>

  <app-auth-social />
</app-auth-layout>
