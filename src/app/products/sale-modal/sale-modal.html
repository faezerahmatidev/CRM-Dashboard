@if (open) {
  <div class="modal-overlay" (click)="close()">
    <div #dialog class="modal-card" role="dialog" aria-label="Sale details" tabindex="-1" (click)="$event.stopPropagation()" (keydown.tab)="trapTab($event)">
      <button class="close-btn corner" type="button" aria-label="Close" (click)="close()">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>

      <div class="buyer-hero">
        <span class="buyer-badge">RS</span>
        <h2>Randall Shelton</h2>
        <span class="buyer-mail">randallshelton.7890@gmail.com</span>
        <div class="socials">
          <button type="button" aria-label="Facebook"><b>f</b></button>
          <button type="button" aria-label="Pinterest"><b>P</b></button>
          <button type="button" aria-label="Twitter">
            <svg viewBox="0 0 24 24"><path d="M4 5h3.5l4.5 6 4-6H20l-6.5 8.5L20.5 19H17l-4.8-6.4L7.5 19H3.5l7-9L4 5Z" /></svg>
          </button>
          <button type="button" aria-label="LinkedIn"><b>in</b></button>
        </div>
      </div>

      <div class="purch-head">
        <h3>Purchases</h3>
        <span class="sort-hint">
          <svg viewBox="0 0 24 24"><path d="M4 7h12M4 12h8M4 17h5" /><path d="m17 9 3 3 3-3M20 12v7" /></svg>
          SORT: <b>DATE</b>
          <svg viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6" /></svg>
        </span>
      </div>

      <ul class="purch-list">
        @for (p of purchases; track p.sku) {
          <li>
            <app-catalog-thumb icon="laptop" [size]="44" [radius]="10" [label]="p.name" />
            <span class="p-titles">
              <b>{{ p.name }}</b>
              <span>{{ p.sku }}</span>
            </span>
            <span class="p-qty">{{ p.qty }}<span>{{ p.date }}</span></span>
            <b class="p-price">{{ p.price }}<span>Price</span></b>
            <button class="dots-btn" type="button" aria-label="Purchase options">...</button>
          </li>
        }
      </ul>

      <div class="hero-actions">
        <a href="mailto:randallshelton.7890@gmail.com">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4.5 7.5 7.5 6 7.5-6"/></svg>
          SEND EMAIL
        </a>
        <button type="button">
          <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>
          MAKE A CALL
        </button>
        <button type="button" (click)="close()">
          <svg viewBox="0 0 24 24"><path d="M4.5 7A1.5 1.5 0 0 1 6 5.5h12A1.5 1.5 0 0 1 19.5 7v8a1.5 1.5 0 0 1-1.5 1.5H12l-3.5 3v-3H6A1.5 1.5 0 0 1 4.5 15V7Z" /></svg>
          SEND MESSAGE
        </button>
      </div>
    </div>
  </div>
}
