<div class="dash-grid" app-dash-page>
  <aside page-info class="info-panel">
    <app-products-sidebar chart="donut" />
  </aside>

  <div page-main class="dash-main">
    <section class="dash-card empty-card" app-view-card>
      <app-empty-state
        image="assets/projects-empty.svg"
        imageAlt="No products illustration"
        title="No products found?"
        text="Try to create more new products or drag xls files to upload items list"
        actionLabel="Create Product"
        (action)="onSetup()"
      />
    </section>
  </div>
</div>
