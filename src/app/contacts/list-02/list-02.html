<div class="dash-grid" app-dash-page>
  <aside page-info class="info-panel">
    <app-contacts-sidebar [stats]="stats" chart="lines" />
  </aside>

  <div page-main class="dash-main">
    <section class="dash-card" app-view-card>
      <app-view-toolbar
        mode="list"
        (modeChange)="onViewChange($event)"
        [sortValue]="store.sortAsc() ? 'A-Z' : 'Z-A'"
        (sortToggle)="store.toggleSort()"
      />
      <app-data-table
        [columns]="columns"
        [rows]="rows()"
        [grid]="grid"
        sortKey="person"
        [sortDir]="store.sortAsc() ? 'asc' : 'desc'"
        [selectable]="false"
        (sortChange)="store.toggleSort()"
        (open)="openById($event)"
        (edit)="openById($event)"
        (remove)="store.remove($event)"
      >
        <ng-template app-cell="person" let-cell let-row="row">
          <span class="c-person">
            @if (contactOf(row.id); as c) {
              <app-contact-avatar [initials]="c.member.initials" [color]="c.member.color" [size]="44" [radius]="12" />
            }
            <span class="c-titles">
              <b>{{ cell.text }}</b>
              <span>{{ cell.sub }}</span>
            </span>
          </span>
        </ng-template>
        <ng-template app-cell="progress" let-cell let-row="row">
          <span class="c-prog">
            <span class="prog-top"><span>{{ cell.sub }}</span><b>{{ cell.text }}</b></span>
            <span class="prog-bar"><span [style.width.%]="contactOf(row.id)?.progress ?? 0" [style.background]="barOf(row.id)"></span></span>
          </span>
        </ng-template>
      </app-data-table>
      <app-pagination [active]="store.page()" (pageChange)="store.setPage($event)" [showPerPage]="true" [perPage]="15" />
    </section>
  </div>
</div>
