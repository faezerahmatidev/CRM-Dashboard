<div class="dash-grid" app-dash-page>
  <aside page-info class="info-panel">
    <app-contacts-sidebar [stats]="stats" chart="donut" />
  </aside>

  <div page-main class="dash-main">
    <section class="dash-card contacts-card">
      <div class="contacts-toolbar">
        <app-view-toggle mode="grid" (modeChange)="onViewChange($event)" />
        <app-sort-control prefix="SORT:" [value]="store.sortAsc() ? 'A-Z' : 'Z-A'" (toggled)="store.toggleSort()" />
      </div>

      <div class="grid-scroll">
        <div class="ccards">
          @for (c of store.inGroup('A'); track c.id) {
            <article class="ccard">
              <button class="dots-btn card-menu" type="button" aria-label="Card options" (click)="store.openDetails(c)">...</button>
              <app-contact-avatar [initials]="c.member.initials" [color]="c.member.color" [size]="56" [radius]="14" />
              <b>{{ nameOf(c) }}</b>
              <span class="c-role">{{ c.role }}</span>
              <span class="tag-pill">{{ c.tag }}</span>
              <div class="card-actions">
                <a class="mail" [href]="'mailto:' + c.email">
                  <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4.5 7.5 7.5 6 7.5-6"/></svg>
                  EMAIL
                </a>
                <a class="call" [href]="'tel:' + c.phone">
                  <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>
                  CALL
                </a>
              </div>
            </article>
          }
        </div>
      </div>
      <app-pagination [active]="store.page()" (pageChange)="store.setPage($event)" />
    </section>
  </div>
</div>
