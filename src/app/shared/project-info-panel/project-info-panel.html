<app-panel-header [logo]="info.logo" logoTint="#e9eefe" logoColor="#5e81f4" [title]="info.name" [sub]="info.category" />

<section>
  <h3 class="widget-title">Description</h3>
  <p class="info-text">{{ info.description }}</p>
</section>

<section>
  <h3 class="widget-title">Due to</h3>
  <div class="pill-row">
    <span class="pill">
      <svg viewBox="0 0 24 24"><rect x="4.5" y="6" width="15" height="13" rx="2"/><path d="M4.5 10h15M8.5 3.5V7M15.5 3.5V7"/></svg>
      {{ info.due }}
    </span>
    <span class="pill">
      <svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M14 3.5V8h4"/></svg>
      {{ info.files }}
    </span>
  </div>
</section>

<section>
  <h3 class="widget-title">Assigned to</h3>
  <div class="members-row">
    <app-avatar-stack [members]="info.assigned" [size]="34" />
    <button class="add-btn" type="button" aria-label="Add member">+</button>
  </div>
</section>

<section>
  <h3 class="widget-title">Client members</h3>
  <div class="members-row">
    <app-avatar-stack [members]="info.clients" [size]="34" />
    <button class="add-btn" type="button" aria-label="Add client">+</button>
  </div>
</section>

<section>
  <h3 class="widget-title">Overall progress</h3>
  <div class="spend-card">
    <div class="spend-top"><span>Spendings</span><b>{{ info.spendings }}</b></div>
    <div class="progress"><i [style.width.%]="info.spendPct"></i></div>
  </div>
</section>

<app-conversion-bars title="Tasks progress" sub="Week to week performance" />
