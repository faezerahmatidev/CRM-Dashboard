<div class="field">
  <label [for]="fieldId">{{ label }}</label>
  <div class="field-control">
    <ng-content />
    <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
      @switch (icon) {
        @case ('user') {
          <circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3.2 4-4.8 7-4.8s5.5 1.6 7 4.8"/>
        }
        @case ('mail') {
          <rect x="4" y="6" width="16" height="12" rx="2"/><path d="m4.5 7.5 7.5 5 7.5-5"/>
        }
        @case ('lock') {
          <rect x="5.5" y="10" width="13" height="9" rx="2"/><path d="M8.5 10V7.8a3.5 3.5 0 0 1 7 0V10"/>
        }
        @case ('building') {
          <rect x="5" y="8" width="14" height="11" rx="1.5"/><path d="M8 8V6.5A1.5 1.5 0 0 1 9.5 5h5A1.5 1.5 0 0 1 16 6.5V8M8 12h2m-2 3h2m2-3h2m-2 3h2M4 19h16"/>
        }
        @case ('users') {
          <circle cx="9" cy="8.5" r="2.8"/><path d="M3.5 18.5c1-2.7 3-4 5.5-4s4.5 1.3 5.5 4M15.5 6.2a2.8 2.8 0 0 1 0 4.9M17.5 14.9c1.4.7 2.4 1.9 3 3.6"/>
        }
        @case ('phone') {
          <path d="M7 4h3l1.5 4.5-2 1.5a12 12 0 0 0 4.5 4.5l1.5-2L20 14v3a1.5 1.5 0 0 1-1.6 1.5C11 18 6 13 5.5 5.6A1.5 1.5 0 0 1 7 4Z"/>
        }
        @case ('chevron') {
          <path d="m6 9.5 6 6 6-6"/>
        }
        @case ('briefcase') {
          <rect x="4" y="8" width="16" height="11" rx="2"/><path d="M9 8V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V8M4 12.5h16"/>
        }
      }
    </svg>
  </div>
</div>
