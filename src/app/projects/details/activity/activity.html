<div class="dash-grid" app-dash-page>
  <aside page-info class="info-panel">
    <app-project-info-panel [info]="info" />
  </aside>

  <div page-main class="dash-main">
    <section class="dash-card activity-card">
      <app-details-tabs>
        <app-sort-control prefix="SORT:" value="DATE" />
      </app-details-tabs>

      <div class="activity-feed">
        @for (g of groups; track g.date) {
          <p class="activity-date">
            <svg viewBox="0 0 24 24"><rect x="4.5" y="6" width="15" height="13" rx="2"/><path d="M4.5 10h15M8.5 3.5V7M15.5 3.5V7"/></svg>
            {{ g.date }}
          </p>
          @for (item of g.items; track item.title) {
            <article class="activity-item">
              <div class="activity-head">
                <h3>{{ item.title }}</h3>
                <button class="dots-btn" type="button" aria-label="More actions">···</button>
              </div>
              <p>{{ item.text }}</p>
              @if (item.photos.length) {
                <div class="photo-row">
                  @for (photo of item.photos; track $index) {
                    <span class="photo" [style.background]="photo"></span>
                  }
                </div>
              }
              <p class="activity-author">
                <app-user-avatar initials="AT" color="linear-gradient(135deg,#5e81f4,#9698d6)" [size]="30" />
                {{ item.author }}
              </p>
            </article>
          }
        }
      </div>

      <app-fab>
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 3.5V8h-4.5" /></svg>
      </app-fab>
    </section>
  </div>
</div>
