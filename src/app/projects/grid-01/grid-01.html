<div class="dash-grid" app-dash-page>
  <aside page-info class="info-panel">
    <app-panel-header logo="C" title="CRAFTUI LLC" sub="8484 Ross Wells" />
    <app-messages-list [count]="5" [viewAll]="true" [messages]="messages" />
    <app-conversion-bars title="Progress history" sub="Week to week performance" />
  </aside>

  <div page-main class="dash-main">
    <section class="dash-card" app-view-card>
      <app-view-toolbar
        mode="grid"
        (modeChange)="onViewChange($event)"
        [sortValue]="sortAsc ? 'A-Z' : 'Z-A'"
        (sortToggle)="sortAsc = !sortAsc"
      />
      <div class="plist-head">
        <span>Projects</span><span>Tasks <i>⇅</i></span><span>Due date <i>⇅</i></span><span>Members <i>⇅</i></span>
      </div>
      <app-card-grid [columns]="4" [collapseBelow]="1500">
        @for (p of sortedProjects(); track p.name) {
          <article class="grid-card clickable-card" routerLink="/projects/details/tasks" replaceUrl [title]="p.name">
            <span class="mini-bar"><i [style.width.%]="p.progress" [style.background]="p.progressColor"></i></span>
            <span class="grid-menu"><app-dots-menu (edit)="onEdit(p)" (remove)="onRemove(p)" /></span>
            <app-project-brand [glyph]="p.brand.glyph" [tint]="p.brand.tint" [color]="p.brand.color" />
            <h3>{{ p.name }}</h3>
            <p>{{ p.category }}</p>
            <p class="complete"><b>{{ p.complete }}</b><span>Tasks complete</span></p>
            <app-avatar-stack [members]="p.members" [extra]="p.gridExtra ?? p.extra" />
          </article>
        }
      </app-card-grid>
      <app-pagination [active]="page" (pageChange)="page = $event" />
    </section>
  </div>
</div>
