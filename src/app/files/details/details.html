<div class="dash-grid" app-dash-page>
  <aside page-info class="info-panel">
    <app-files-sidebar active="My Files" />
  </aside>

  <div page-main class="dash-main">
    <section class="dash-card details-card">
      <div class="details-toolbar">
        <span class="back-hint" aria-hidden="true">‹ BACK</span>
        <button class="dots-btn" type="button" aria-label="File options">...</button>
      </div>

      @if (store.selected(); as f) {
      <div class="details-grid">
        <div class="preview-panel">
          <app-file-badge [badge]="f.badge" [size]="72" [radius]="16" [label]="f.name" />
          <b>{{ f.name }}</b>
          <span class="psize">{{ f.size }}</span>
          <app-avatar-stack [members]="f.shared" [extra]="f.extra" [size]="30" />
          <span class="ftag">
            <svg viewBox="0 0 24 24"><path d="M5 5.5h11.5L20 9l-3.5 3.5H5V5.5Z"/><circle cx="9" cy="9" r="1.2"/></svg>
            {{ f.tag }}
          </span>
        </div>

        <div class="comments-panel">
          <div class="comments-head">
            <h3>Comments</h3>
            <span class="sort-hint">
              <svg viewBox="0 0 24 24"><path d="M4 7h12M4 12h8M4 17h5" /><path d="m17 9 3 3 3-3M20 12v7" /></svg>
              SORT: <b>NEWEST FIRST</b>
              <svg viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6" /></svg>
            </span>
          </div>

          <div class="bubbles">
            @for (c of comments; track $index) {
              @if (c.from === 'them') {
                <div class="row them">
                  <app-user-avatar [initials]="f.shared[0].initials" [color]="f.shared[0].color" [size]="28" />
                  <span class="bubble grey">{{ c.text }}<span class="btime">{{ c.time }}</span></span>
                </div>
              } @else {
                <div class="row me">
                  <span class="bubble blue">{{ c.text }}</span>
                  <app-user-avatar initials="ME" color="linear-gradient(135deg,#5e81f4,#9698d6)" [size]="28" />
                </div>
                <span class="metime">{{ c.time }}</span>
              }
            }
          </div>

          <div class="composer">
            <input [(ngModel)]="draft" (keyup.enter)="send()" placeholder="Add your comment" aria-label="Add your comment" />
            <button class="icon" type="button" aria-label="Attach">
              <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8L13 4a3.7 3.7 0 0 1 5.2 5.2l-8.2 8.2a1.85 1.85 0 0 1-2.6-2.6L15 7.5" /></svg>
            </button>
            <button class="icon" type="button" aria-label="Emoji">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9 9.5h.01M15 9.5h.01M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8" /></svg>
            </button>
            <button class="send" type="button" (click)="send()">Send</button>
          </div>
        </div>
      </div>
      } @else {
        <p class="gone">This file is no longer available. <a routerLink="/files/grid" replaceUrl>Back to files</a></p>
      }
    </section>
  </div>
</div>
