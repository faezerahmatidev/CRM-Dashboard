@if (open) {
  <div class="modal-overlay" (click)="close()">
    <div
      #dialog
      class="modal-card"
      role="dialog"
      aria-label="Upload files"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown.tab)="trapTab($event)"
      (dragover)="$event.preventDefault()"
      (drop)="onDrop($event)"
    >
      <div class="modal-top">
        <span class="modal-kicker">Upload Files</span>
        <button class="close-btn" type="button" aria-label="Close" (click)="close()">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>

      <button class="dropzone" type="button" (click)="browse()">
        <svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 1 1 .6-8.96A5.5 5.5 0 0 1 18.3 10H18a3.5 3.5 0 0 1 .5 6.96" /><path d="M12 12v8M8.5 15.5 12 12l3.5 3.5" /></svg>
        <b>Drag your files here to upload</b>
        <span>or click to browse</span>
      </button>
      <input #picker type="file" multiple hidden (change)="picked()" aria-label="Choose files" />
    </div>
  </div>
}
